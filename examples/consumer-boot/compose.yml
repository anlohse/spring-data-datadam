name: datadam-consumer
services:
  datadam:
    image: ${DATADAM_IMAGE:-ghcr.io/anlohse/datadam@sha256:a93e6fc4096ace4564fecc96c570ac2436cab3e9031acf0aefe1f0b004812a76}
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - consumer-data:/var/lib/datadam
      - ./docker/datadam.conf:/etc/datadam/consumer.conf:ro
    entrypoint: ["datadam", "/etc/datadam/consumer.conf"]
volumes:
  consumer-data:
