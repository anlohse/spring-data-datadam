# Disposable local consumer verification; these credentials are not deployment defaults.
bind 0.0.0.0
port 6379
memcache-port 0
protected-mode yes
dir /var/lib/datadam
read-threads 2
user default off
user consumer-schema on >local-consumer-schema-password ~consumer:* +@connection +idx.create +idx.info +idx.list +ft.create +ft.info
user consumer-app on >local-consumer-app-password ~consumer:book:* +@connection +json.get +json.set +json.del +del +eval +idx.query +idx.count +idx.get +ft.search
