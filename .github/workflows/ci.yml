name: Build and integration tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Check out pinned Datadam source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . ./scripts/test-images.ps1
          $images = Get-DatadamTestImages
          git clone --filter=blob:none --no-checkout https://github.com/anlohse/datadam.git "$env:RUNNER_TEMP/datadam-source"
          if ($LASTEXITCODE -ne 0) { throw 'Datadam clone failed' }
          git -C "$env:RUNNER_TEMP/datadam-source" cat-file -e "$($images.DATADAM_REVISION)^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Datadam revision is unavailable' }
      - name: Build and verify against real Datadam
        shell: pwsh
        run: ./scripts/run-ci.ps1 -BuildDatadam -Source "$env:RUNNER_TEMP/datadam-source"
      - name: Upload reports and artifact manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: validation-${{ github.run_id }}
          retention-days: 14
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            datadam-demo/target/compatibility/**
            target/library-artifacts.json
            target/ci-verification.json
            examples/consumer-boot/target/verification.json
