name: datadam-spring-data
services:
  datadam:
    image: ${DATADAM_IMAGE:-ghcr.io/anlohse/datadam@sha256:a93e6fc4096ace4564fecc96c570ac2436cab3e9031acf0aefe1f0b004812a76}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - datadam-data:/var/lib/datadam
      - ./docker/datadam.conf:/etc/datadam/spring-data.conf:ro
    entrypoint: ["datadam", "/etc/datadam/spring-data.conf"]
    restart: unless-stopped
volumes:
  datadam-data:
