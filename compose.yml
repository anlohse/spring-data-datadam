name: datadam-spring-data
services:
  datadam:
    image: ${DATADAM_IMAGE:-datadam:spring-data-e2e2c0ae4e92}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - datadam-data:/var/lib/datadam
      - ./docker/datadam.conf:/etc/datadam/spring-data.conf:ro
    entrypoint: ["datadam", "/etc/datadam/spring-data.conf"]
    restart: unless-stopped
volumes:
  datadam-data:
