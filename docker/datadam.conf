# Local development credentials only. Publish the port on host loopback exclusively.
bind 0.0.0.0
port 6379
memcache-port 0
protected-mode yes
dir /var/lib/datadam
read-threads 4
user default off
user schema on >local-schema-password ~demo:* +@connection +idx.create +idx.info +idx.drop +ft.create +ft.info
user app on >local-app-password ~demo:customer:* ~demo:temporary:* ~demo:audited:* ~demo:versioned:* ~demo:mutation:* ~demo:hash:* +@connection +hlen +hget +hgetall +hreplace +json.get +json.set +json.del +json.numincrby +json.nummultby +json.arrappend +json.arrinsert +json.arrpop +json.arrtrim +json.arrlen +json.arrindex +json.merge +del +scan +expire +ttl +eval +pexpire +pttl +pexpiretime +persist +idx.query +idx.count +idx.get +ft.search
# Test writer: JSON.SET and EVAL allowed, PEXPIRE denied. TTL saves must fail before touching the document.
user ttl-restricted on >local-ttl-restricted-password ~demo:temporary:* ~demo:hash:* +@connection +hlen +hget +hgetall +hreplace +json.get +json.set +eval
# Test user: demonstrates that native query totals and results obey readable key patterns.
user reader on >local-reader-password %R~demo:customer:visible* %R~demo:hash:customer:visible* +@connection +json.get +idx.query +idx.count +idx.get +ft.search
# Projection tests: selected index content only; no full-document read command.
user projection-reader on >local-projection-reader-password %R~demo:customer:visible* %R~demo:hash:customer:visible* +@connection +idx.query +idx.count +ft.search
