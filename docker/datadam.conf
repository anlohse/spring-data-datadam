# Local development credentials only. Publish the port on host loopback exclusively.
bind 0.0.0.0
port 6379
memcache-port 0
protected-mode yes
dir /var/lib/datadam
read-threads 4
user default off
user schema on >local-schema-password ~demo:* +@connection +idx.create +idx.info +idx.drop +ft.create +ft.info
user app on >local-app-password ~demo:customer:* ~demo:temporary:* ~demo:audited:* +@connection +json.get +json.set +json.del +json.numincrby +del +scan +expire +ttl +eval +pexpire +pttl +pexpiretime +persist +idx.query +idx.count +idx.get +ft.search
# Test writer: JSON.SET and EVAL allowed, PEXPIRE denied. TTL saves must fail before touching the document.
user ttl-restricted on >local-ttl-restricted-password ~demo:temporary:* +@connection +json.get +json.set +eval
# Test user: demonstrates that native query totals and results obey readable key patterns.
user reader on >local-reader-password %R~demo:customer:visible* +@connection +json.get +idx.query +idx.count +idx.get +ft.search
